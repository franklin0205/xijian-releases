name: Package verified 0.5.1 for Mac
on:
  push:
    branches: ['codex/mac-0.5.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    defaults:
      run:
        working-directory: mac-input
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mac-input/package-lock.json
      - run: npm ci
      - name: Package native architecture
        run: node scripts/package-mac.cjs
      - name: Verify signature and run packaged application
        run: |
          set -euo pipefail
          app_path="$(find release -maxdepth 2 -name '息间.app' -type d | head -1)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          node scripts/packaged-smoke.mjs "$app_path/Contents/MacOS/息间"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-051-${{ matrix.arch }}
          path: |
            mac-input/release/*.dmg
            mac-input/release/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check-051-${{ matrix.arch }}
          path: mac-input/artifacts/
          if-no-files-found: warn
  publish:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-051-*
          path: packages
          merge-multiple: true
      - name: Append verified Mac packages to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(find packages -name '*.dmg' | wc -l)" -eq 2
          test "$(find packages -name '*.zip' | wc -l)" -eq 2
          cd packages
          sha256sum *.dmg *.zip > macOS-SHA256SUMS.txt
          gh release upload v0.5.1 *.dmg *.zip macOS-SHA256SUMS.txt
